<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INCOBES – Universidades / Universities</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="header-slot"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 data-i18n="uni_page_title">Universidades Participantes</h1>
        <p data-i18n="uni_page_sub">Instituciones vinculadas a nuestra red de investigación</p>
      </div>
    </section>

    <section class="page-content">
      <div class="container" style="max-width: 1000px; text-align: center;">
        
        <div class="uni-grid">
          
          <a href="https://www.unam.mx/" target="_blank" rel="noopener noreferrer" class="uni-logo fade-up" aria-label="UNAM">
            <img src="img/unam.svg" alt="Logo UNAM">
          </a>

          <a href="https://www.uabc.mx/" target="_blank" rel="noopener noreferrer" class="uni-logo fade-up delay-1" aria-label="UABC">
            <img src="img/uabc.png" alt="Logo UABC">
          </a>

          <a href="https://www.uaeh.edu.mx/" target="_blank" rel="noopener noreferrer" class="uni-logo fade-up delay-2" aria-label="UAEH">
            <img src="img/UAEH.svg" alt="Logo UAEH">
          </a>

          <a href="https://www.udg.mx/" target="_blank" rel="noopener noreferrer" class="uni-logo fade-up delay-3" aria-label="UDG">
            <img src="img/udg.svg" alt="Logo UDG">
          </a>

          <a href="https://www.ox.ac.uk/" target="_blank" rel="noopener noreferrer" class="uni-logo fade-up delay-4" aria-label="University of Oxford">
            <img src="img/oxford.png" alt="Logo Oxford">
          </a>

          <a href="https://www.upf.edu/" target="_blank" rel="noopener noreferrer" class="uni-logo fade-up delay-4" aria-label="Universitat Pompeu Fabra">
            <img src="img/upf.png" alt="Logo Universitat Pompeu Fabra">
          </a>

        </div>

      </div>
    </section>
  </main>

  <div id="footer-slot"></div>
  <div id="toast-notification" class="toast">Correo copiado al portapapeles</div>
  
  <script src="main.js"></script>
</body>
</html>
